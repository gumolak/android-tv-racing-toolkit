<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title"><title id="title">Credited-lap first-event timing and a pause-aware active-clock ramp</title><rect width="1400" height="800" fill="#0b1020"/><g font-family="Arial, sans-serif">
